<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>freeCodeCamp Survey</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1 id="title">freeCodeCamp Survey Form</h1>
  <p id="description"><i>Thank you for taking the time to help us improve the platform</i></p>
  <form method="post" action='https://register-demo.freecodecamp.org' id="survey-form">
    <fieldset>
      <label for="name" id="name-label">Name<input id="name" name="first-name" type="text" placeholder="Enter your name" required /></label>
      <label for="email" id="email-label">Email<input id="email" name="email" type="email" placeholder="Enter your email" required /></label>
      <label for="number" id="number-label">Age (optional)<input id="number" type="number" name="age" min="13" max="120" placeholder="Age" /></label>
      <label for="dropdown">Which option best describes your current role?
        <select id="dropdown" name="referrer">
          <option value="">Select current role</option>
          <option value="1">Student</option>
          <option value="2">Full time job</option>
          <option value="3">Full time learner</option>
          <option value="4">Prefer not to say</option>
          <option value="5">Other</option>
        </select>

        <p class="recommend">Would you recommend freeCodeCamp to a friend?</p>
        <label for="personal-account"><input class="inline" id="personal-account" type="radio" name="account-type"
          value="definitely"  checked />
          Definitely</label>
        <label for="personal-account"><input class="inline" id="personal-account" type="radio" name="account-type"
          value="maybe"   />
          Maybe</label>
        <label for="business-account"><input class="inline" id="business-account" type="radio" name="account-type" value="not sure"/>
          Not sure</label>
      </label>
    </fieldset>

    <fieldset>
      <label for="referrer">What is your favorite feature of freeCodeCamp?
        <select id="most-like" name="mostLike" class="form-control" required="">
          <option disabled="" selected="" value="">Select an option</option>
          <option value="challenges">Challenges</option>
          <option value="projects">Projects</option>
          <option value="community">Community</option>
          <option value="openSource">Open Source</option>
        </select>
      </label>
    </fieldset>

    <fieldset class="suggestion">
        <p>
          What would you like to see improved?
          <span class="clue">(Check all that apply)</span>
        </p>

        <label><input name="prefer" value="front-end-projects" type="checkbox" class="inline">Front-end
          Projects</label>
        <label>
          <input name="prefer" value="back-end-projects" type="checkbox" class="inline">Back-end
          Projects</label>
        <label><input name="prefer" value="data-visualization" type="checkbox" class="inline">Data
          Visualization</label>
        <label><input name="prefer" value="challenges" type="checkbox" class="inline">Challenges</label>
        <label><input name="prefer" value="open-source-community" type="checkbox" class="inline">Open Source
          Community</label>
        <label><input name="prefer" value="gitter-help-rooms" type="checkbox" class="inline">Gitter help
          rooms</label>
        <label><input name="prefer" value="videos" type="checkbox" class="inline">Videos</label>
        <label><input name="prefer" value="city-meetups" type="checkbox" class="inline">City Meetups</label>
        <label><input name="prefer" value="wiki" type="checkbox" class="inline">Wiki</label>
        <label><input name="prefer" value="forum" type="checkbox" class="inline">Forum</label>
        <label><input name="prefer" value="additional-courses" type="checkbox" class="inline">Additional
          Courses</label>
    </fieldset>

    <fieldset>
      <label for="comments">Any comments or suggestions?
        <textarea rows="6" cols="50" id="comments" name="comment" placeholder="Enter your comment here..."></textarea>
      </label>
    </fieldset>
    <input id="submit" type="submit" value="Submit" />
  </form>
</body>

</html>
